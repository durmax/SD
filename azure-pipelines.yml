trigger:
- work

variables:
  buildConfiguration: 'Release'

stages:

# ---------- Build Stage ----------
- stage: Build
  displayName: 'Build Stage'
  jobs:
  - job: BuildProjects
    displayName: 'Build Client and Server'
    pool:
      vmImage: 'windows-latest'

    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '8.0.x'

    - task: DotNetCoreCLI@2
      displayName: 'Restore solution'
      inputs:
        command: 'restore'
        projects: |
          SD/Client/SD.Client.csproj
          SD/Server/SD.Api.csproj

    - task: DotNetCoreCLI@2
      displayName: 'Build Client'
      inputs:
        command: 'build'
        projects: 'SD/Client/SD.Client.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Build Server'
      inputs:
        command: 'build'
        projects: 'SD/Server/SD.Api.csproj'
        arguments: '--configuration $(buildConfiguration)'

    - task: DotNetCoreCLI@2
      displayName: 'Publish Server'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'SD/Server/SD.Api.csproj'
        arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/Server'
        zipAfterPublish: true

    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/Server'
        artifactName: 'webapi'
        publishLocation: 'Container'

